name: Auto-Patch & Build SukiSU Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo docker image prune -af || true

      - name: Install Build Dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential bc bison flex libssl-dev libelf-dev git zip libncurses5-dev wget curl

      - name: Setup Android Clang Toolchain
        run: |
          echo "==> Mengambil Proton Clang 13 (AOSP Clang)..."
          git clone --depth=1 https://github.com/kdrag0n/proton-clang.git toolchain

      - name: Checkout Sukisu Kernel Source
        uses: actions/checkout@v4
        with:
          ref: sukisu_bpf
          path: kernel_src

      - name: Auto-Patch Uname Spoof to 5.15.136
        run: |
          cd kernel_src
          echo "==> Sedang patch uname spoof kepada 5.15.136..."
          sed -i 's/5.10.248/5.15.136/g' kernel/sys.c
          grep -n "5.15.136" kernel/sys.c

      - name: Compile Kernel Image & DTBO
        run: |
          cd kernel_src
          export PATH="${GITHUB_WORKSPACE}/toolchain/bin:$PATH"
          export ARCH=arm64
          export SUBARCH=arm64
          export CC=clang
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-

          make O=out vendor/lahaina-perf_defconfig
          make -j$(nproc --all) O=out LLVM=1 LLVM_IAS=1 Image dtbo.img

      - name: Package with AnyKernel3
        run: |
          git clone https://github.com/osm0sis/AnyKernel3.git AK3
          cp kernel_src/out/arch/arm64/boot/Image AK3/
          cp kernel_src/out/arch/arm64/boot/dtbo.img AK3/ 2>/dev/null || true
          sed -i 's/device.name1=.*/device.name1=lemonadep/' AK3/anykernel.sh
          sed -i 's/device.name2=.*/device.name2=OnePlus9Pro/' AK3/anykernel.sh
          sed -i 's/is_slot_device=.*/is_slot_device=1/' AK3/anykernel.sh
          cd AK3 && zip -r9 ../Kernel-SukiSU-5.15-Patched.zip * -x .git README.md

      - name: Upload Kernel Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Patched_SukiSU_Kernel
          path: Kernel-SukiSU-5.15-Patched.zip
