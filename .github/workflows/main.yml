name: Auto-Patch & Build SukiSU Kernel (Rizqing)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo docker image prune -af || true

      - name: Install Build Dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential bc bison flex libssl-dev libelf-dev git zip libncurses5-dev wget curl

      - name: Setup Android Clang Toolchain
        run: |
          echo "==> Mengambil Proton Clang..."
          git clone --depth=1 https://github.com/kdrag0n/proton-clang.git toolchain

      - name: Checkout Sukisu Kernel Source
        uses: actions/checkout@v4
        with:
          ref: sukisu_bpf
          path: kernel_src
          fetch-depth: 1

      - name: Setup SukiSU Ultra & Fix Missing Kconfigs
        run: |
          cd kernel_src
          echo "==> Menguruskan submodule SukiSU Ultra..."
          git submodule deinit -f --all || true
          rm -rf .git/modules/KernelSU || true
          rm -rf KernelSU

          # Klon kod sumber SukiSU rasmi
          git clone --depth=1 https://github.com/ShirkNeko/SukiSU.git KernelSU || \
          git clone --depth=1 https://github.com/ReSukiSU/ReSukiSU.git KernelSU

          echo "==> Membaiki rujukan Kconfig modul vendor..."
          mkdir -p kernel/tuning kernel/sched_assist
          touch kernel/tuning/Kconfig
          touch kernel/sched_assist/Kconfig

          # Padam baris rujukan yang menyebabkan parser terhenti
          sed -i '/source "kernel\/tuning\/Kconfig"/d' init/Kconfig || true
          sed -i '/source "kernel\/sched_assist\/Kconfig"/d' init/Kconfig || true

          # Elakkan ralat gcc-version.sh
          sed -i 's/printf "%d%02d%02d\\n" "$MAJOR" "$MINOR" "$PATCHLEVEL"/printf "0\\n"/' scripts/gcc-version.sh || true

      - name: Inspect and Patch Uname Spoof
        run: |
          cd kernel_src
          echo "==> Menyemak dan menampal spoof 5.15.136..."
          sed -i 's/5.10.[0-9]*/5.15.136/g' kernel/sys.c || true
          sed -i 's/5.10.248/5.15.136/g' kernel/sys.c || true

          if ! grep -q "5.15.136" kernel/sys.c; then
            sed -i '/copy_to_user(name, &tmp, sizeof(tmp))/i \
            if (strcmp(current->comm, "bpfloader") == 0 || strcmp(current->comm, "netbpfload") == 0 || strcmp(current->comm, "netd") == 0) { \
                strncpy(tmp.release, "5.15.136", sizeof(tmp.release)); \
            }' kernel/sys.c || true
          fi

      - name: Compile Kernel Image & DTBO
        run: |
          cd kernel_src
          export PATH="${GITHUB_WORKSPACE}/toolchain/bin:$PATH"
          export ARCH=arm64
          export SUBARCH=arm64
          export CC=clang

          # Label identiti binaan
          export KBUILD_BUILD_USER="rizqing"
          export KBUILD_BUILD_HOST="lemonadep"

          mkdir -p out

          echo "==> Menjana defconfig..."
          if [ -f "arch/arm64/configs/vendor/lahaina-perf_defconfig" ]; then
            make O=out CC=clang LLVM=1 LLVM_IAS=1 vendor/lahaina-perf_defconfig
          elif [ -f "arch/arm64/configs/lahaina-perf_defconfig" ]; then
            make O=out CC=clang LLVM=1 LLVM_IAS=1 lahaina-perf_defconfig
          else
            make O=out CC=clang LLVM=1 LLVM_IAS=1 $(find arch/arm64/configs -name "*lahaina*perf*" -printf "%f\n" | head -n 1)
          fi

          echo "==> Mengaktifkan SukiSU dan penyesuaian nama..."
          echo 'CONFIG_LOCALVERSION="-Rizqing-BPF"' >> out/.config
          echo "CONFIG_KSU=y" >> out/.config

          echo "==> Memulakan kompilasi..."
          make -j$(nproc --all) O=out \
            CC=clang \
            LLVM=1 \
            LLVM_IAS=1 \
            Image dtbo.img

      - name: Package with AnyKernel3
        run: |
          git clone https://github.com/osm0sis/AnyKernel3.git AK3
          cp kernel_src/out/arch/arm64/boot/Image AK3/
          cp kernel_src/out/arch/arm64/boot/dtbo.img AK3/ 2>/dev/null || true
          sed -i 's/device.name1=.*/device.name1=lemonadep/' AK3/anykernel.sh
          sed -i 's/device.name2=.*/device.name2=OnePlus9Pro/' AK3/anykernel.sh
          sed -i 's/is_slot_device=.*/is_slot_device=1/' AK3/anykernel.sh
          cd AK3 && zip -r9 ../Kernel-Rizqing-SukiSU-5.15-OnePlus9Pro.zip * -x .git README.md

      - name: Upload Kernel Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-RizqingOwO-SukiSU-OnePlus9Pro
          path: Kernel-RizqingOwO-SukiSU-5.15-OnePlus9Pro.zip
